# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional: Settings → Secrets and variables → Actions → Variables →
#           APPS_SCRIPT_URL = https://script.google.com/macros/s/<id>/exec
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read          # configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Files uploaded through the GitHub website lose their folders.
      # This puts them back where the app expects them.
      - name: Arrange files into folders
        run: |
          set -e
          # A browser saves a second download as "app (2).js". Such a copy is
          # never used, so the app would silently keep the old file.
          renamed=$(ls | grep -E ' \([0-9]+\)\.' || true)
          if [ -n "$renamed" ]; then
            echo "::error::These files have a browser-added number in their name and will NOT be used: $renamed"
            echo "::error::Delete the old file with the plain name, then rename each of these to its plain name (e.g. 'app (2).js' -> 'app.js')."
            exit 1
          fi
          if [ -f site/index.html ]; then
            echo "Folder layout already present."
          else
            mkdir -p site/assets/css site/assets/js site/assets/icons site/assets/vendor scripts
            mv index.html config.js manifest.webmanifest sw.js site/
            mv app.css offline.css site/assets/css/
            mv api.js app.js sync-ui.js pwa.js theme-init.js frame-guard.js site/assets/js/
            mv apple-touch-icon.png favicon-32.png favicon.svg icon-192.png icon-512.png maskable-512.png site/assets/icons/
            mv exceljs.min.js site/assets/vendor/
            mv build.mjs make-gas-index.mjs scripts/
            touch site/.nojekyll
            echo "Arranged uploaded files into site/ and scripts/."
          fi
          # Apps Script files uploaded loose go into apps-script/ (they are never published).
          if ls *.gs >/dev/null 2>&1; then mkdir -p apps-script && mv *.gs apps-script/; fi

      - name: Check JavaScript syntax
        run: |
          set -e
          for f in site/assets/js/*.js site/sw.js site/config.js scripts/build.mjs scripts/make-gas-index.mjs; do node --check "$f"; done
          if ls apps-script/*.gs >/dev/null 2>&1; then
            # Apps Script shares one global scope across files: check them together.
            cat apps-script/*.gs > "$RUNNER_TEMP/apps-script.js" && node --check "$RUNNER_TEMP/apps-script.js"
          fi

      - name: Build
        env:
          APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: node scripts/build.mjs

      # The Apps Script-hosted page (Index.html) is generated from the same files, so it can never
      # drift from the GitHub site. Download it from this run's "Artifacts" and paste it into Apps Script.
      - name: Generate Apps Script Index.html
        run: mkdir -p gas-out && node scripts/make-gas-index.mjs gas-out/Index.html

      - uses: actions/upload-artifact@v4
        with:
          name: apps-script-Index.html
          path: gas-out/Index.html
          retention-days: 30

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
